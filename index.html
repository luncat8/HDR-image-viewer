<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Viewer</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="stage">
	<img id="pic" alt="" draggable="false">
	<p id="bad" hidden></p>
</div>

<div id="empty">
	<h1>Drop files or folders</h1>
	<p>or move pointer to left edge / long press / <b>F</b> for menu</p>
	<p>or switch to the <a href="gpu.html">adjustable WebGPU viewer</a></p>
	<p class="keys">
		<b>&larr;</b> <b>&rarr;</b> <b>space</b> or <b>wheel</b> &mdash; prev / next &middot;
		<b>C</b> &mdash; copy path
	</p>
</div>

<div id="toast"></div>

<aside id="list" hidden>
	<nav class="pages">
		<b>&lt;img&gt; viewer</b>
		<a href="gpu.html">WebGPU HDR viewer</a>
	</nav>
	<header>
		<button id="btnFiles" type="button">Open Files</button>
		<button id="btnPaste" type="button" title="Paste newline-separated image paths or URLs">Paste List</button>
		<button id="btnCopyAll" type="button" title="Copy all image paths">Copy All</button>
		<button id="btnFolder" type="button">Open Folder</button>
		<button id="btnForget" type="button" title="Forget all">Forget</button>
		<button id="btnClose" type="button" title="Close">X</button>
	</header>
	<div id="listSub">
		<span id="listCount">0 images</span>
	</div>
	<ol id="listItems"></ol>
</aside>

<input type="file" id="pickFiles" accept="image/*" multiple hidden>
<input type="file" id="pickFolder" webkitdirectory directory multiple hidden>

<script src="js/files.js"></script>
<script src="js/viewer.js"></script>
<script src="js/app.js"></script>
</body>
</html>
